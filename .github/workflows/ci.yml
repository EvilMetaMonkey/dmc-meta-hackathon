name: Test and package smoke
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.5'
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/check_analyzer.dart
      - run: dart test --concurrency=1
      - run: dart test tool/haven_contract_test.dart --concurrency=1
      - run: dart build cli -o build/ci-dmc
      - if: runner.os != 'Windows'
        run: dart run tool/smoke_bundle.dart build/ci-dmc/bundle/bin/dmc
      - if: runner.os == 'Windows'
        run: dart run tool/smoke_bundle.dart build/ci-dmc/bundle/bin/dmc.exe
      # Doc (doc/) is a separate package; its tests drive the bundle built above.
      - run: dart pub get --enforce-lockfile
        working-directory: doc
      - run: dart analyze --fatal-infos
        working-directory: doc
      - run: dart test --concurrency=1
        working-directory: doc
        env:
          DMC_TEST_BIN: ${{ github.workspace }}/build/ci-dmc/bundle/bin/${{ runner.os == 'Windows' && 'dmc.exe' || 'dmc' }}
